; mini-cctv camera node (ESP32-S3 + OV2640/OV3660/OV5640)
; Pick the env that matches your board:  pio run -e s3cam -t upload
;
;   s3cam        ESP32-S3-WROOM CAM boards with OCTAL PSRAM (N8R8 / N16R8):
;                Freenove ESP32-S3 WROOM CAM, Espressif ESP32-S3-EYE, most "ESP32-S3 CAM" clones
;   s3cam_qspi   same pinout but QUAD PSRAM (N8R2 / N4R2)
;   s3cam_lcd    boards that use the ESP32S3_CAM_LCD pinout (XCLK=40, SIOD=17)
;   xiao_s3      Seeed XIAO ESP32S3 Sense

[platformio]
default_envs = s3cam
src_dir = mini_cctv   ; the Arduino sketch folder is the single source of truth

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

[env:s3cam]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP32S3_EYE

[env:s3cam_qspi]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP32S3_EYE

[env:s3cam_lcd]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP32S3_CAM_LCD

[env:xiao_s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCAMERA_MODEL_XIAO_ESP32S3
